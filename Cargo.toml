[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "AGPL-3.0-only"
repository = "https://github.com/originalkamaal/Auvora"
publish = false

[workspace.dependencies]
auvora-core = { path = "crates/auvora-core" }

# ADR-0047 §3: workspace-wide lints. CI runs clippy with -D warnings.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# ADR-0046: cargo-vet audit store kept under .cargo/ (ADR-0111 closed root set).
[workspace.metadata.vet]
store = { path = "./.cargo/supply-chain" }
